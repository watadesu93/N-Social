<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>N Social - ホーム</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <!-- 左カラム -->
        <aside class="sidebar-left">
            <div class="logo">N Social</div>
            <nav>
                <div class="nav-item">🏠 ホーム</div>
                <div class="nav-item">🔍 検索</div>
                <div class="nav-item">🔥 トレンド</div>
                <div class="nav-item">🔔 通知</div>
                <div class="nav-item">👤 プロフィール</div>
            </nav>
        </aside>

        <!-- 中央カラム -->
        <main class="main-content">
            <div class="page-title">ホーム</div>
            <!-- js/app.js でここに投稿が挿入されます -->
            <div id="timeline"></div>
        </main>

        <!-- 右カラム -->
        <aside class="sidebar-right">
            <div class="trend-card">
                <h2>トレンド</h2>
                <!-- js/app.js でここにトレンドが挿入されます -->
                <div id="trend-list"></div>
            </div>
        </aside>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
