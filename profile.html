<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>N Social - プロフィール</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <!-- 左カラム -->
        <aside class="sidebar-left">
            <div class="logo">N Social</div>
            <nav>
                <a href="index.html" class="nav-item link-text" style="display:block;">🏠 ホーム</a>
                <div class="nav-item">🔍 検索</div>
                <div class="nav-item">🔥 トレンド</div>
                <div class="nav-item">🔔 通知</div>
                <a href="profile.html?id=user1" class="nav-item link-text" style="display:block;">👤 プロフィール</a>
            </nav>
        </aside>

        <!-- 中央カラム -->
        <main class="main-content">
            <div class="page-title">
                <a href="index.html" class="link-text" style="margin-right: 15px;">←</a>
                <span id="profile-header-name">読み込み中...</span>
            </div>
            
            <div class="profile-header-box">
                <div class="profile-banner"></div>
                <div class="profile-info-container">
                    <div class="profile-icon-large" id="profile-icon"></div>
                    <div id="profile-name"></div>
                    <div class="post-account" id="profile-account"></div>
                    <div class="profile-bio" id="profile-bio"></div>
                </div>
            </div>

            <!-- js/app.js でここに絞り込まれた投稿が挿入されます -->
            <div id="timeline"></div>
        </main>

        <!-- 右カラム -->
        <aside class="sidebar-right">
            <div class="trend-card">
                <h2>トレンド</h2>
                <div id="trend-list"></div>
            </div>
        </aside>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
